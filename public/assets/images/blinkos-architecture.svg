  <text x="680" y="302" class="small muted">Liquidity, profit, risk</text>

  <path d="M966 157 L1133 155 Q1146 157 1145 169 L1144 319 Q1143 330 1132 331 L965 333 Q954 332 955 321 L954 168 Q955 158 966 157 Z" fill="#eaf3e8" class="outline"/>
