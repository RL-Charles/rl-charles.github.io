<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title description">
  <title id="title">BlinkOS application architecture</title>
  <desc id="description">The React client sends requests to FastAPI, which handles company access, uploads, integrations, analysis jobs, and WebSocket progress. Uploaded documents and Xero, QuickBooks, and Procore data are normalized into company financial data in DuckDB. A LangGraph analysis workflow reads that data and uses AWS Bedrock to produce reports, chart specifications, and decisions. PostgreSQL stores companies, documents, and reports. Redis supports jobs, events, caching, and DuckDB write locks.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#40505a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    .ink { fill: #27343b; }
    .muted { fill: #52616a; }
    .title { font: 700 36px 'Trebuchet MS', Arial, sans-serif; }
    .subtitle { font: 18px 'Trebuchet MS', Arial, sans-serif; }
    .box-title { font: 700 26px 'Trebuchet MS', Arial, sans-serif; }
    .body { font: 18px 'Trebuchet MS', Arial, sans-serif; }
    .small { font: 16px 'Trebuchet MS', Arial, sans-serif; }
    .label { font: 700 17px 'Trebuchet MS', Arial, sans-serif; }
    .outline { stroke: #40505a; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .sketch { fill: none; stroke: #40505a; stroke-width: 1.1; opacity: .42; stroke-linecap: round; stroke-linejoin: round; }
    .flow { fill: none; stroke: #40505a; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    .link { fill: none; stroke: #677782; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 5 6; marker-end: url(#arrow); }
  </style>

  <rect width="1200" height="680" fill="#fbfaf6"/>
  <text x="55" y="59" class="title ink">BlinkOS application architecture</text>
  <text x="55" y="89" class="subtitle muted">Business data becomes a financial review, decisions, and dashboards.</text>
  <path d="M55 108 C331 106 577 110 851 107 L1145 109" fill="none" stroke="#d2d7d3" stroke-width="2" stroke-linecap="round"/>

