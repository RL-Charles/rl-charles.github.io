  <text x="80" y="272" class="body ink">Dashboards and chat</text>
  <text x="80" y="302" class="small muted">Auth0 sign-in</text>

  <path d="M365 156 L598 154 Q610 156 610 168 L608 319 Q606 332 595 331 L365 333 Q355 332 355 321 L354 168 Q355 157 365 156 Z" fill="#fbefd9" class="outline"/>
  <path d="M361 161 L603 159 M359 325 L599 327" class="sketch"/>
  <text x="380" y="203" class="box-title ink">FastAPI</text>
  <text x="380" y="242" class="body ink">JWT + company access</text>
  <text x="380" y="272" class="body ink">Uploads and sync jobs</text>
  <text x="380" y="302" class="small muted">HTTP + WebSocket progress</text>

  <path d="M665 156 L900 153 Q911 155 910 166 L908 319 Q907 332 897 331 L665 333 Q654 331 655 321 L654 168 Q654 158 665 156 Z" fill="#f0ebf6" class="outline"/>
  <path d="M662 161 L903 158 M660 326 L901 326" class="sketch"/>
