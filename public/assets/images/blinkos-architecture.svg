  <path d="M361 431 L903 428 M359 579 L901 580" class="sketch"/>
  <text x="380" y="468" class="box-title ink">Company data and job state</text>
  <text x="380" y="503" class="body ink"><tspan font-weight="700">DuckDB</tspan>  financial facts per company</text>
  <text x="380" y="535" class="body ink"><tspan font-weight="700">PostgreSQL</tspan>  companies, documents, reports</text>
  <text x="380" y="567" class="body ink"><tspan font-weight="700">Redis</tspan>  jobs, events, cache, write locks</text>

  <path d="M966 426 L1133 423 Q1146 425 1145 437 L1144 571 Q1143 584 1132 584 L965 586 Q954 585 955 574 L954 439 Q955 428 966 426 Z" fill="#f6e9e4" class="outline"/>
  <path d="M961 431 L1138 428 M960 580 L1138 579" class="sketch"/>
  <text x="980" y="468" class="box-title ink" style="font-size: 22px">AWS Bedrock</text>
  <text x="980" y="507" class="body ink">Model calls</text>
  <text x="980" y="537" class="small muted">Analysis + chat</text>

  <path d="M314 505 L332 505 Q339 504 339 496 L339 305 Q339 294 347 293" class="link"/>
  <path d="M482 338 C481 365 481 390 482 416" class="link"/>
  <path d="M784 416 C784 391 784 365 784 341" class="link"/>
  <path d="M912 310 C939 337 937 400 947 458" class="link"/>

  <text x="55" y="638" class="small muted">Uploads and integrations feed company data. The API coordinates analysis and serves results to the client.</text>
</svg>
