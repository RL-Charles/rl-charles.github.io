  <text x="980" y="242" class="body ink">CFO report</text>
  <text x="980" y="272" class="body ink">Decisions</text>
  <text x="980" y="302" class="small muted">Charts + insights</text>

  <path d="M316 243 C329 241 338 243 347 243" class="flow"/>
  <path d="M616 243 C629 241 638 243 647 243" class="flow"/>
